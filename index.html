<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173a2e">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="BENGALOOP is temporarily offline while we prepare the next chapter. The platform has not closed.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/bengaloop-avatar.png">
  <title>BENGALOOP | Temporarily Offline</title>
  <style>
    :root{color-scheme:light;--forest:#173a2e;--ink:#233b30;--muted:#68766c;--paper:#f8f7f1;--line:#dfe5da;--accent:#b96e4b}
    *{box-sizing:border-box}
    html{min-height:100%;background:var(--paper)}
    body{min-height:100vh;min-height:100svh;margin:0;padding:28px;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%,rgba(218,230,214,.62),transparent 58%),var(--paper);color:var(--ink);font-family:Manrope,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:min(100%,760px);padding:clamp(30px,7vw,76px);border:1px solid var(--line);background:rgba(255,254,250,.88);box-shadow:0 26px 80px rgba(23,58,46,.07);text-align:center}
    .brand{display:block;width:min(310px,78%);height:auto;margin:0 auto 52px}
    .eyebrow{display:inline-flex;align-items:center;gap:10px;color:#748272;font-size:10px;font-weight:800;letter-spacing:2.2px;text-transform:uppercase}
    .eyebrow:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(185,110,75,.12)}
    h1{margin:23px 0 20px;color:var(--forest);font-family:Georgia,serif;font-size:clamp(37px,7vw,64px);font-weight:400;line-height:1.08;letter-spacing:-1.8px}
    h1 em{color:var(--accent);font-weight:400}
    .message{max-width:510px;margin:0 auto;color:var(--muted);font-size:clamp(14px,2vw,16px);line-height:1.9}
    .status{display:inline-flex;align-items:center;gap:9px;margin-top:38px;padding:12px 16px;border:1px solid var(--line);color:var(--forest);font-size:10px;font-weight:800;letter-spacing:1.5px}
    .status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent)}
    footer{margin-top:55px;padding-top:22px;border-top:1px solid var(--line);color:#879286;font-size:9px;font-weight:700;letter-spacing:1.7px}
    @media(max-width:480px){body{padding:14px}main{padding:38px 22px}.brand{margin-bottom:42px}footer{margin-top:42px}}
    @media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main aria-labelledby="maintenance-title">
    <img class="brand" src="/bengaloop-logo.svg" width="310" height="75" alt="BENGALOOP">
    <div class="eyebrow">A brief pause · BENGALOOP</div>
    <h1 id="maintenance-title">We're taking a moment<br><em>to build what comes next.</em></h1>
    <p class="message">BENGALOOP is temporarily offline while we prepare the next chapter. The platform has not closed. Our website will return.</p>
    <div class="status" role="status">TEMPORARILY UNAVAILABLE</div>
    <footer>BENGALOOP &nbsp;·&nbsp; S.G. PALYA &nbsp;·&nbsp; BENGALURU</footer>
  </main>
</body>
</html>
