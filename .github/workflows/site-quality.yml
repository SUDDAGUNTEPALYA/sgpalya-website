name: Site quality checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: site-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate website structure and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate pages, links, assets and integration contracts
        run: python tools/validate_site.py

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check recruitment.js
          node --check business-registration.js
          node --check tools/browser-smoke.cjs

      - name: Install Chromium smoke-test dependency
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Run desktop and mobile browser checks
        run: node tools/browser-smoke.cjs

      - name: Upload responsive page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bengaloop-responsive-smoke-screenshots
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
